name: Provider Health Check

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  validate-providers:
    name: Validate Provider Deep Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run provider validation
        run: pnpm validate:providers
        continue-on-error: true
        id: validation

      - name: Open issue if providers are failing
        if: steps.validation.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '{}';
            try {
              report = fs.readFileSync('tools/provider-validator/report.json', 'utf8');
            } catch (e) {}

            const result = JSON.parse(report);
            const failing = Object.entries(result)
              .filter(([, v]) => v.classification === 'unreachable')
              .map(([id, v]) => {
                const status = v.status ?? 'request error';
                const detail = v.error ? ` (${v.error})` : '';
                return `- **${id}**: ${status} — ${v.url}${detail}`;
              });

            if (failing.length > 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Auto] Provider health check failed — ${failing.length} provider(s) unreachable`,
                body: [
                  '## Weekly Provider Health Check Failed',
                  '',
                  'The following compose destinations were genuinely unreachable:',
                  '',
                  ...failing,
                  '',
                  '**Action required**: Please update the provider source in `tools/provider-generator/data/providers.json` and regenerate the registry.',
                  '',
                  `Report generated at: ${new Date().toISOString()}`,
                ].join('\n'),
                labels: ['provider-update', 'automated'],
              });
            }
