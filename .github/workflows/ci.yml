name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check provider data is in sync
        run: pnpm generate:providers && git diff --exit-code

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm format:check

      - name: Test provider validator
        run: pnpm --filter @smart-mailto/provider-validator test

      - name: Run tests with coverage
        run: pnpm --filter @smart-mailto/core exec vitest run --coverage

      - name: Run React wrapper tests
        run: pnpm --filter @smart-mailto/react test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/core/coverage/coverage-final.json

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check core bundle size
        run: |
          CORE_SIZE=$(gzip -c packages/core/dist/index.js 2>/dev/null | wc -c || echo "0")
          echo "Core bundle (gzipped): ${CORE_SIZE} bytes"
          if [ "$CORE_SIZE" -gt "8192" ]; then
            echo "❌ Bundle too large: ${CORE_SIZE}b (limit: 8KB gzipped)"
            exit 1
          else
            echo "✅ Bundle size OK: ${CORE_SIZE}b"
          fi
