name: Feature Request
description: Suggest a new provider, geo-mapping, or enhancement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea!

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - New Provider
        - Geo Mapping
        - Framework Wrapper
        - Documentation
        - Performance
        - Other
    validations:
      required: true
